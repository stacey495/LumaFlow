<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
<title id="title">LumaFlow — контейнерний режим</title>
<desc id="desc">Браузер звертається через HTTPS до Python-вебсервера. У ньому API і планувальник використовують SQLite. Планувальник розподіляє задачі між двома базовими і двома додатковими серверами та керує ними через Docker.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#416c52"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1c3021}.title{font-size:35px;font-weight:700}.head{font-size:19px;font-weight:650}.sub{font-size:15px;fill:#3e5e49}.small{font-size:13px;fill:#3e5e49}.box{fill:#fff;stroke:#abc1ad;stroke-width:1.5}.app{fill:#f7fcf4;stroke:#83a58a;stroke-width:1.5}.scale{stroke-dasharray:7 5}.flow{fill:none;stroke:#416c52;stroke-width:2;marker-end:url(#a)}.two{marker-start:url(#a)}.plain{fill:none;stroke:#416c52;stroke-width:2}.control{stroke-dasharray:6 5}</style>
