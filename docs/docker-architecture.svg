<text x="590" y="397" text-anchor="middle" class="small">FIFO · вибір вільного сервера · ETA · масштабування 2–4</text>
<rect x="908" y="263" width="209" height="100" rx="9" class="box"/>
<text x="1012" y="292" text-anchor="middle" class="head">SQLite</text>
